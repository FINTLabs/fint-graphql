buildscript {
    dependencies {
        constraints {
            classpath('org.apache.commons:commons-lang3:3.21.0') {
                because 'The build plugin classpath also needs the fix for GHSA-j288-q9x7-2f5v.'
            }
        }
    }
}

plugins {
    id 'base'
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'io.github.ben-manes.versions' version '0.66.0' apply false
}

allprojects {
    group = 'no.fintlabs'
    repositories {
        maven { url 'https://repo.fintlabs.no/releases' }
        mavenCentral()
    }
}

tasks.named('build') { dependsOn ':app:build', ':model-generator:build' }
tasks.named('check') { dependsOn ':app:check', ':model-generator:check' }
tasks.named('clean') { dependsOn ':app:clean', ':model-generator:clean' }
