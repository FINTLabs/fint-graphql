name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Get repo name
        id: get_repo
        run: echo "REPO=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Gradle Setup
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: wrapper

      - name: Gradle build
        run: |
          ./gradlew build
          mkdir data
          cp ./app/build/libs/fint-graphql.jar ./data/app.jar

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{steps.get_repo.outputs.REPO}}
          path: ./data/app.jar

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-reports
          path: |
            app/build/reports/tests/test/
            model-generator/build/reports/tests/test/
          retention-days: 3
