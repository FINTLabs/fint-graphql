name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'model-generator/src/main/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/**'
      - 'model-generator/src/main/java/**'
      - '**/build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 26 for CodeQL
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '26'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true
          queries: security-extended

      # CodeQL supports builds through Java 26. Analyze the same production
      # sources, dependencies, and generated model code using that toolchain;
      # normal builds and containers default to Java 27 in gradle.properties.
      - name: Compile production code
        run: ./gradlew --no-daemon -PjavaVersion=26 :app:compileJava :model-generator:compileJava

      - name: Analyze Java
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:java-kotlin

  actions:
    name: GitHub Actions security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.1
        with:
          languages: actions
          queries: security-extended

      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@v4.39.1
        with:
          category: /language:actions
