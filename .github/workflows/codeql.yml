name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/main/java/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/**'
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: java-kotlin
          build-mode: manual
          dependency-caching: true
          queries: security-extended

      # Compile production sources explicitly so CodeQL sees the exact Gradle
      # classpath, annotation processors, and generated model code used at runtime.
      - name: Compile production code
        run: ./gradlew --no-daemon compileJava

      - name: Analyze Java
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:java-kotlin

  actions:
    name: GitHub Actions security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: actions
          queries: security-extended

      - name: Analyze GitHub Actions
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:actions
