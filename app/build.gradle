plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
    id 'groovy'
    id 'io.github.ben-manes.versions'
}

group = 'no.fintlabs'

def targetJavaVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').get().toInteger())
def isMacOs = providers.systemProperty('os.name').get().startsWith('Mac')

if (!isMacOs) {
    // Reactor Netty also brings macOS DNS artifacts transitively. Keep both the
    // provider class and native libraries out of Linux CI and container builds.
    configurations.configureEach {
        exclude group: 'io.netty', module: 'netty-resolver-dns-native-macos'
        exclude group: 'io.netty', module: 'netty-resolver-dns-classes-macos'
    }
}

java {
    toolchain {
        languageVersion = targetJavaVersion
    }
}

tasks.withType(GroovyCompile).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = targetJavaVersion
    }
}

repositories {
    maven {
        url "https://repo.fintlabs.no/releases"
    }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    if (isMacOs) {
        // Spring Boot manages the version; support both Intel and Apple Silicon locally.
        runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-aarch_64'
        runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-x86_64'
    }
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation('commons-beanutils:commons-beanutils:1.11.0') {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation("no.novari:fint-utdanning-resource-model-java:${apiVersion}") {
        // Models use shared Jackson annotations and legacy TypeReference, but no Jackson 2 databind APIs.
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
    }
    implementation("no.novari:fint-administrasjon-resource-model-java:${apiVersion}") {
        // Models use shared Jackson annotations and legacy TypeReference, but no Jackson 2 databind APIs.
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
    }

    implementation 'org.springframework.boot:spring-boot-starter-graphql'
    implementation 'com.graphql-java:graphql-java-extended-scalars:24.0'
    implementation 'org.apache.commons:commons-lang3'
    implementation 'com.google.guava:guava:33.7.1-jre'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.spockframework:spock-spring:2.5-groovy-5.0'
    testImplementation 'org.spockframework:spock-core:2.5-groovy-5.0'
    testImplementation 'net.bytebuddy:byte-buddy'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-graphql-test'
    testImplementation 'com.squareup.okhttp3:mockwebserver3:5.5.1'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

jar {
    enabled = false
}

bootJar {
    enabled = true
    archiveFileName = 'fint-graphql.jar'
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

configurations {
    codeGenerator {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    codeGenerator project(':model-generator')
}

def modelFile = rootProject.layout.projectDirectory.file(
        ".gradle/fint-model/${apiVersion}/${modelSha256}/FINT-informasjonsmodell.xml")
def generatedGraphql = layout.buildDirectory.dir('generated/graphql')
def exclusions = ['Fravar', 'Fravarstype']
def schemaExclusions = []
def manualServices = ['no.novari.fint.model.felles.Person']

def generateGraphql = tasks.register('generateGraphql', JavaExec) {
    group = 'build'
    description = 'Generate application sources and schema from the pinned FINT information model.'
    dependsOn ':model-generator:downloadFintModel'
    classpath = configurations.codeGenerator
    javaLauncher = javaToolchains.launcherFor { languageVersion = targetJavaVersion }
    mainClass = 'no.fint.graphql.generator.GenerateGraphql'
    inputs.file(modelFile).withPathSensitivity(PathSensitivity.NONE)
    inputs.property('exclusions', exclusions)
    inputs.property('schemaExclusions', schemaExclusions)
    inputs.property('manualServices', manualServices)
    inputs.property('modelVersion', apiVersion)
    inputs.property('modelSha256', modelSha256)
    outputs.dir(generatedGraphql)
    args modelFile.asFile.absolutePath, generatedGraphql.get().asFile.absolutePath,
            exclusions.join(','), schemaExclusions.join(','), manualServices.join(',')
}

sourceSets.main.java.srcDir(generateGraphql.map { generatedGraphql.get().dir('java') })
sourceSets.main.resources.srcDir(generateGraphql.map { generatedGraphql.get().dir('resources') })
