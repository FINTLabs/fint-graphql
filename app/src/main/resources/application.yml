fint:
  endpoint:
    root: http://traefik.traefik-v2
    host: beta.felleskomponent.no
  webclient:
    connect-timeout-ms: 10000
    response-timeout: PT10S
    connection-provider:
      maxConnections: 100
      acquireTimeout: 2000
      acquireMaxCount: -1
      maxIdleTime: PT30S
      maxLifeTime: PT90S
  graphql:
    async-request-timeout: PT1M55S
    query-timeout: PT1M50S
    relation-pagination:
      threshold: 50
      page-size: 500

server:
  forward-headers-strategy: framework

spring:
  http:
    codecs:
      # The 256 KB default is far too small for a page of resources.
      max-in-memory-size: 16MB
  graphql:
    schema:
      locations: classpath:schema/**/
    graphiql:
      enabled: true
  mvc:
    async:
      request-timeout: 0
  threads:
    virtual:
      enabled: true

management:
  metrics:
    web:
      client:
        max-uri-tags: 256
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,ping
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    no.fint.graphql: INFO
